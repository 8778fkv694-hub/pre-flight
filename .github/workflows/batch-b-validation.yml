name: Pre-flight Batch B validation
on:
  push:
    branches: [feat/v2-batch-b-routing-handoff]
  pull_request:
    paths:
      - 'pre-flight/**'
      - '.github/workflows/batch-b-validation.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Batch A and B regression tests
        run: python3 -m unittest discover -s pre-flight/tests -v
      - name: Compile scripts
        run: python3 -m compileall -q pre-flight/scripts pre-flight/tests
      - name: Check handoff example
        run: python3 pre-flight/scripts/check_handoff.py --file pre-flight/assets/examples/batch-b-handoff.example.json --mode check
